name: Scheduler verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: scheduler-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness-and-builds:
    name: Unit, rendered UI, lint, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint:ci
      - run: npm run build:vercel
      - run: npm run build
      - run: npm run test:rendered

  deterministic-stress:
    name: 6,000-workload independent stress model
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:stress

  browser-visualization:
    name: Production browser audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, compact-chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:audit -- --project=${{ matrix.project }}
      - name: Preserve browser audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
